name: Run deadline pipeline

on:
  schedule:
    # Every hour, on the hour — see claude/tradeoffs/cron-interval.md
    - cron: "0 * * * *"
  workflow_dispatch: {}  # manual trigger, per the original spec's requirement

# Least privilege: this job only reads its own code and calls external
# APIs (Gemini, Neon, Google) via secrets — it never touches the GitHub
# API itself, so the default token needs no permissions at all.
permissions:
  contents: read

# One run at a time. A manual dispatch overlapping a scheduled run (or late
# scheduled runs bunching up) queues instead of running side by side. This
# matters for the per-day Gemini call budget, which only counts *finished*
# runs: two overlapping runs would each think the budget was still free.
# cancel-in-progress is false on purpose — never kill a run mid-email.
concurrency:
  group: run-deadline-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # A run is pacing-bound (13s per Gemini call: 50 emails ~ 11 min worst case,
    # far less under the daily budget). GitHub's default is 6 hours — a hung API
    # call shouldn't hold a runner, or the concurrency slot above, that long. A
    # run killed by this is safe: its claims go stale and are retried.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: gemini-3.6-flash
          FILTER_LEVEL: moderate
          FETCH_WINDOW_DAYS: "2"
          CALENDAR_TIMEZONE: America/Los_Angeles
        run: python -m scripts.run_pipeline

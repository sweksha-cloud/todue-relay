name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Also callable from deploy.yml, so a deploy is gated by its own test run on the same commit.
  workflow_call:

# Least privilege: only checks out code and runs pytest against a
# throwaway service-container database — never touches the GitHub API.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/testdb
        run: python -m pytest tests/ -v
